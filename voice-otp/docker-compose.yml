services:
  redis:
    image: redis
    container_name: redis-otp
    ports:
      - "6379:6379"

  asterisk:
    image: andrius/asterisk:latest
    container_name: asterisk-otp
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "8088:8088/tcp"
      - "10000-10200:10000-10200/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./asterisk-config/pjsip.conf:/etc/asterisk/pjsip.conf
      - ./asterisk-config/extensions.conf:/etc/asterisk/extensions.conf
      - ./asterisk-config/http.conf:/etc/asterisk/http.conf
      - ./asterisk-config/ari.conf:/etc/asterisk/ari.conf
      - ./asterisk-config/rtp.conf:/etc/asterisk/rtp.conf
      - ./asterisk-sounds:/var/lib/asterisk/sounds
      - ./asterisk-config/pjsip.trunk.conf:/etc/asterisk/pjsip.trunk.conf
