[otp-call]
exten => otp-call,1,NoOp(Voice OTP ${CODE})
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playtones(425/400,0/200)
 same => n,Wait(1)
 same => n,StopPlaytones()
 same => n,Playback(otp)
 same => n,Wait(1)
 same => n,Playback(otp)
 same => n,Wait(1)
 same => n,SayDigits(${CODE})
 same => n,Wait(1)
 same => n,SayDigits(${CODE})
 same => n,Hangup()

; ARI → Local/{digits}@otp-trunk-dial
; Dial() + U() joue le code APRÈS décroché, puis log DIALSTATUS.
[otp-trunk-dial]
exten => _X.,1,NoOp(VoiceOTP trunk dial +${EXTEN} CODE=${CODE})
 same => n,Set(CALLERID(all)=VoiceOTP <+13122101366>)
 same => n,Set(CALLERID(num)=+13122101366)
 same => n,Dial(PJSIP/+${EXTEN}@trunk,60,U(otp-play^${CODE}))
 same => n,NoOp(VoiceOTP dial done status=${DIALSTATUS} cause=${HANGUPCAUSE})
 same => n,Hangup()

[otp-play]
exten => s,1,NoOp(VoiceOTP play CODE=${ARG1})
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(beep)
 same => n,Wait(0.5)
 same => n,SayDigits(${ARG1})
 same => n,Wait(1)
 same => n,SayDigits(${ARG1})
 same => n,Wait(1)
 same => n,SayDigits(${ARG1})
 same => n,Return()

; Côté Local ;1 après réponse — attendre la fin du Dial.
[otp-trunk-idle]
exten => s,1,NoOp(VoiceOTP local idle)
 same => n,Wait(90)
 same => n,Hangup()

; Ancien chemin ARI direct PJSIP/...@trunk (secours).
[otp-trunk]
exten => s,1,NoOp(Voice OTP trunk ${CODE})
 same => n,Answer()
 same => n,Wait(1)
 same => n,SayDigits(${CODE})
 same => n,Wait(1)
 same => n,SayDigits(${CODE})
 same => n,Hangup()
