[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; IP publique actuelle (doit matcher l'IP vue par Telnyx).
external_media_address=82.151.76.207
external_signaling_address=82.151.76.207

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060
external_media_address=82.151.76.207
external_signaling_address=82.151.76.207

[1000]
type=endpoint
context=otp-call
language=en
disallow=all
allow=ulaw,alaw
auth=1000-auth
aors=1000
direct_media=no
rtp_symmetric=yes
rewrite_contact=yes
force_rport=yes
ice_support=no
media_address=82.151.76.207
identify_by=auth_username,username,ip

[1000-auth]
type=auth
auth_type=userpass
username=1000
password=changeme123

[1000]
type=aor
max_contacts=1
remove_existing=yes
; OPTIONS qualify through Docker NAT marks the phone Unreachable
; even when REGISTER succeeded, so originate returns "sent" with no audio.
qualify_frequency=0

; Trunk SIP production : copier pjsip.trunk.conf.example vers pjsip.trunk.conf
; puis remplir identifiants / IP du fournisseur. Le labo Linphone 1000 reste actif.
#tryinclude pjsip.trunk.conf

